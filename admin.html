<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈 배틀 · 관리자</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 주소를 하나로 합쳤습니다. 예전에 저장해 둔 주소로 들어와도 새 주소로 넘깁니다.
  // 강사용 화면은 기본 주소의 '강사용 →' 버튼으로 들어갑니다.
  location.replace('./?host=1');
</script>
</head>
<body>
<div class="wrap">
  <section class="panel center stack">
    <h1>주소가 하나로 합쳐졌어요</h1>
    <p class="muted" style="margin:0">잠시 후 새 주소로 이동합니다.</p>
    <p><a href="./?host=1">바로 이동하기</a></p>
  </section>
</div>
</body>
</html>
