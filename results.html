<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈 배틀 · 전체 순위</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 주소를 하나로 합쳤습니다. 예전 주소(results.html?room=CODE)로 들어와도
  // 새 주소(./?results=CODE)로 넘깁니다.
  var room = new URLSearchParams(location.search).get('room') || '';
  location.replace('./?results=' + encodeURIComponent(room));
</script>
</head>
<body>
<div class="wrap">
  <section class="panel center stack">
    <h1>주소가 하나로 합쳐졌어요</h1>
    <p class="muted" style="margin:0">잠시 후 새 주소로 이동합니다.</p>
    <p><a href="./">바로 이동하기</a></p>
  </section>
</div>
</body>
</html>
